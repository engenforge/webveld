<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replaced focus indicator</title>
<style>
a { color: #06c; }
a:focus { outline: none; background-color: #ff0; color: #000; }
a:focus.alt { outline-width: 0; border-bottom: 2px solid #000; }
</style>
</head>
<body>
<h1>Replaced focus indicator</h1>
<p>Section 9 permits removing the outline when the same block establishes another
visible indicator. Both rules below do.</p>
<p><a href="/somewhere">A link with a replacement indicator.</a></p>
</body>
</html>
