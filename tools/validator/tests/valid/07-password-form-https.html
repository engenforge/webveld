<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Valid Password Form with HTTPS</title>
  </head>
  <body>
    <form action="https://auth.example.com/login" method="post">
      <p>
        <label for="user">Username</label>
        <input type="text" id="user" name="user" autocomplete="username" required>
      </p>
      <p>
        <label for="pass">Password</label>
        <input type="password" id="pass" name="password" autocomplete="current-password" required>
      </p>
      <p>
        <button type="submit">Log In</button>
      </p>
    </form>
  </body>
</html>
