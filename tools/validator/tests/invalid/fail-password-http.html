<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Password over HTTP</title>
  </head>
  <body>
    <!-- expect: a form containing a password field requires an https action (5.2) -->
    <form action="http://insecure.example.com/login" method="post">
      <label for="pwd">Password</label>
      <input type="password" id="pwd" name="password">
      <button type="submit">Login</button>
    </form>
  </body>
</html>
