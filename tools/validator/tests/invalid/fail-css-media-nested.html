<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Nested Media Queries</title>
    <style>
      @media (min-width: 600px) {
        /* expect: nested @media rules are forbidden (6.6) */
        @media (min-width: 800px) {
          body { color: red; }
        }
      }
    </style>
  </head>
  <body>
    <p>Test</p>
  </body>
</html>
