<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Forbidden Has Selector</title>
    <style>
      /* expect: selector :has() is forbidden (6.7) */
      article:has(p) {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <article><p>Test</p></article>
  </body>
</html>
