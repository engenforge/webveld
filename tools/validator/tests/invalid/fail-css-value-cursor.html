<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Forbidden Cursor Value</title>
    <style>
      /* expect: value `not-allowed` is not permitted for `cursor` (6.2) */
      button[disabled] {
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <button disabled>Disabled</button>
  </body>
</html>
