<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grid track bound</title>
    <style>
      /* expect: repeat(1000000) exceeds the 10,000 track bound */
      /* repeat() count above the 6.2 bound of 10,000: a layout denial of
         service written entirely in permitted constructs. */
      .grid { display: grid; grid-template-columns: repeat(1000000, 1fr); }
    </style>
  </head>
  <body>
    <h1>Grid track bound</h1>
    <div class="grid"><p>One</p></div>
  </body>
</html>
