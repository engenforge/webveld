<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Text-browser case: sectioning elements</title>
</head>
<body>
  <a href="#content">Skip to content</a>
  <header><p>SITE HEADER</p></header>
  <nav><a href="/a">Alpha</a> <a href="/b">Beta</a></nav>
  <main id="content">
    <article>
      <h1>Title</h1>
      <section>
        <h2>Sub</h2>
        <p>Body text.</p>
      </section>
    </article>
  </main>
  <aside><p>SIDEBAR</p></aside>
  <footer><p>FOOTER</p></footer>
</body>
</html>
