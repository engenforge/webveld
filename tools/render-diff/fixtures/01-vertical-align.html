<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gap Test: vertical-align</title>
  <style>
    body { font-family: sans-serif; margin: 20px; font-size: 16px; line-height: 2; }
    .box { border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; }
    .big { font-size: 32px; background: #eee; }
    .va-baseline { vertical-align: baseline; color: red; }
    .va-top { vertical-align: top; color: blue; }
    .va-middle { vertical-align: middle; color: green; }
    .va-bottom { vertical-align: bottom; color: purple; }
    .va-sub { vertical-align: sub; color: orange; font-size: 12px; }
    .va-super { vertical-align: super; color: brown; font-size: 12px; }
  </style>
</head>
<body>
  <h1>vertical-align Test</h1>
  <div class="box">
    <span class="big">Main</span>
    <span class="va-baseline">[baseline]</span>
    <span class="va-top">[top]</span>
    <span class="va-middle">[middle]</span>
    <span class="va-bottom">[bottom]</span>
    <span class="va-sub">[sub]</span>
    <span class="va-super">[super]</span>
  </div>
  <p>Standard text with H<sub>2</sub>O and E=mc<sup>2</sup> to test native sub and sup tags.</p>
</body>
</html>
