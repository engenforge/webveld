<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gap Test: caption-side</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 300px; margin-bottom: 20px; }
    th, td { border: 1px solid #333; padding: 6px; }
    .cap-top { caption-side: top; color: blue; font-weight: bold; }
    .cap-bottom { caption-side: bottom; color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>caption-side Test</h1>
  <table>
    <caption class="cap-top">Caption Side: Top</caption>
    <tr><th>Col A</th><th>Col B</th></tr>
    <tr><td>Cell 1</td><td>Cell 2</td></tr>
  </table>
  <table>
    <caption class="cap-bottom">Caption Side: Bottom</caption>
    <tr><th>Col A</th><th>Col B</th></tr>
    <tr><td>Cell 1</td><td>Cell 2</td></tr>
  </table>
</body>
</html>
