<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gap Test: text-transform</title>
  <style>
    body { font-family: sans-serif; margin: 20px; font-size: 18px; }
    p { margin: 10px 0; padding: 8px; border: 1px solid #ccc; }
    .cap { text-transform: capitalize; color: blue; }
    .upper { text-transform: uppercase; color: green; }
    .lower { text-transform: lowercase; color: red; }
    .none { text-transform: none; color: black; }
  </style>
</head>
<body>
  <h1>text-transform Test</h1>
  <p class="cap">this text should be capitalized on each word</p>
  <p class="upper">this text should be uppercase</p>
  <p class="lower">THIS TEXT SHOULD BE LOWERCASE</p>
  <p class="none">This Text Has No Transformation</p>
</body>
</html>
